<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics 4 (G-FPYJY6T5J9). Skipped on crew pages (/newsroom, /score) so staff visits don't inflate audience numbers. -->
    <script>
      if (!/^\/(newsroom|score)(\/|$)/.test(location.pathname)) {
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-FPYJY6T5J9';
        document.head.appendChild(gaScript);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FPYJY6T5J9');
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IND Sports Media</title>
    <meta name="description" content="Indiana high school sports: live game coverage, photos, highlights and stories from IND Sports Media." />
    <!-- Social preview cards. /news/* pages get story-specific values from netlify/edge-functions/news-preview.ts -->
    <meta property="og:site_name" content="IND Sports Media" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IND Sports Media" />
    <meta property="og:description" content="Indiana high school sports: live game coverage, photos, highlights and stories." />
    <meta property="og:image" content="https://indsports.media/logo.png" />
    <meta property="og:url" content="https://indsports.media/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate icon" href="/favicon.jpg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" id="apple-icon" href="/apple-touch-icon.png" />
    <!-- Installable app. /newsroom and /score swap in the IND Crew manifest (see src/main.tsx). -->
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" id="apple-title" content="IND Sports" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-white selection:bg-[#00BFFF] selection:text-black">
    <div id="root"></div>
    <!-- Netlify Forms registration (hidden). The React forms post to these by name. -->
    <form name="partner-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="bot-field" /><input name="name" /><input name="email" /><textarea name="details"></textarea></form>
    <form name="contact" data-netlify="true" hidden><input name="name" /><input name="email" /><textarea name="details"></textarea></form>
    <form name="advertise" data-netlify="true" hidden><input name="name" /><input name="email" /><textarea name="details"></textarea></form>
    <form name="media-credentials" data-netlify="true" hidden><input name="name" /><input name="email" /><textarea name="details"></textarea></form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
