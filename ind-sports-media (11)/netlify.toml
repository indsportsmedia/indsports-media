[build]
  command = "vite build"
  publish = "dist"

[build.environment]
  # The only "likely secret" flagged is the public Firebase web API key
  # (firebase-applet-config.json), which is designed to ship in client bundles.
  # Access is enforced by Firestore Security Rules, not by key secrecy.
  # Standard secrets scanning of environment variable values remains active.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# App (PWA) files: always check for a fresh copy so updates reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
